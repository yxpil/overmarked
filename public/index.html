<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>OVERMARKED — annotation workbench</title>
  <link rel="icon" href="/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div id="boot" class="boot-screen" aria-live="polite">
    <div class="boot-mark"><span></span><span></span><span></span><span></span></div>
    <div class="boot-word">OVERMARKED</div>
    <div class="boot-meta">loading workbench</div>
  </div>

  <header id="topbar" class="topbar" hidden></header>
  <main id="view" class="view"></main>
  <div id="toasts" class="toasts" aria-live="polite" aria-atomic="false"></div>
  <div id="modal-root"></div>

  <noscript><div class="noscript">OVERMARKED 需要启用 JavaScript。</div></noscript>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
